name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup conda
      uses: s-weigand/setup-conda@v1
      with:
        update-conda: true
        python-version: "3.10"
        conda-channels: anaconda, conda-forge
    - run: conda --version
    - run: which python
    - name: Install the library
      run: |
        conda install -c conda-forge rdkit -y
        pip install setuptools
        pip install -e .
    - name: Test import and core functionality
      run: |
        python -c "
        import rxnfp
        from rxnfp.tokenization import SmilesTokenizer
        from rxnfp.transformer_fingerprints import RXNBERTFingerprintGenerator, get_default_model_and_tokenizer, generate_fingerprints
        print('rxnfp version:', rxnfp.__version__)
        print('All imports successful')
        "